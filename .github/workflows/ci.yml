name: CI

# Run the Jac test suite on every PR into main (and on main itself).
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".github/scripts/build_docs.py"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".github/scripts/build_docs.py"
      - ".github/workflows/pages.yml" 
  workflow_dispatch:

# One run per ref; a new push cancels the previous in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: jac test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The native `jac` is a self-contained binary that bundles its own Python +
      # jaclang + byllm runtime, so there is nothing to `pip install`. The install
      # script drops it in $HOME/.local/bin; we add that to PATH for later steps.
      - name: Install native jac
        # The install script queries the GitHub API for the latest release; on
        # shared runner IPs the unauthenticated limit (60/hr) causes flaky
        # failures. It honors GITHUB_TOKEN (5000/hr) — pass it, and retry for
        # plain network flakes.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3; do
            curl -fsSL https://raw.githubusercontent.com/jaseci-labs/jaseci/main/scripts/install.sh | bash && break
            echo "install attempt $i failed; retrying in $((i*10))s..."
            sleep $((i*10))
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show jac version
        run: jac --version

      # byLLM is bundled in the native binary, but some Python deps are not (PyYAML
      # for the AG-IR compiler, rich + prompt_toolkit for the chat REPL). Bare
      # `jac install` provisions exactly what jac.toml declares — do NOT re-list
      # packages here: an explicit list silently drifts from jac.toml, which is how
      # `sigil chat` once shipped dead with "No module named 'rich'" (#87).
      - name: Provision runtime dependencies (from jac.toml)
        run: jac install

      # Guards the drift above: the test suite never imports the chat REPL, so a
      # missing REPL dependency was invisible until a user ran `sigil chat`. This
      # boots the real CLI entry point and quits at the prompt — it exits non-zero
      # if any of src/sigil_chat.jac's imports are unprovisioned. No API key needed:
      # /exit returns before a model is ever called.
      - name: Smoke-test the chat REPL
        run: printf '/exit\n' | jac run src/main.jac -s "$RUNNER_TEMP/ci.session" -- chat

      # The agent lives in the src/ package. `src/*.test.jac` picks up every annex
      # test (present and future) automatically; report_fix_tests.jac and
      # lowering_fix_tests.jac are standalone regression suites (non-annex names),
      # so they are named explicitly.
      - name: Run test suite
        run: jac test src/*.test.jac src/report_fix_tests.jac src/lowering_fix_tests.jac
      # SEPARATE process on purpose: loading these annexes in the same jac test
      # invocation as another src module resets the by-llm slot's __globals__
      # (py3.14 lazy-annotation eval then dies with NameError on the slot's own
      # types — reproduce with: jac test src/compiler/ai/spec_loop.test.jac
      # src/report_fix_tests.jac). Runtime bug, process isolation sidesteps it.
      - name: Run AI-compiler test suite
        run: jac test src/compiler/ai/*.test.jac
      # The MockLLM convergence loops run under `jac run`: multi-module
      # `jac test` resets a by-llm slot's __globals__ and the schema build dies
      # with NameError on the slot's own types (same runtime bug as above).
      - name: Run AI-compiler convergence scenarios
        run: |
          jac run src/compiler/ai/scenarios/spec_loop.jac
          jac run src/compiler/ai/scenarios/adjudicate.jac
          jac run src/compiler/ai/scenarios/workflow_loop.jac
          jac run src/compiler/ai/scenarios/lift_e2e.jac
          jac run src/compiler/ai/scenarios/lift_direct.jac
          jac run src/compiler/ai/scenarios/runtime_budget.jac
