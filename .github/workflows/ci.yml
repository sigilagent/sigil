name: CI

# Run the Jac test suite on every PR into main (and on main itself).
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".github/scripts/build_docs.py"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".github/scripts/build_docs.py"
      - ".github/workflows/pages.yml" 
  workflow_dispatch:

# One run per ref; a new push cancels the previous in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: jac test
    runs-on: ubuntu-latest
    # 15 left almost no headroom: green runs already landed between 10m40s and
    # 14m27s, and one timed out at 15m outright — a timeout the job reports as a
    # CANCELLED step, which reads like an infra blip rather than a budget. The
    # queued work adds ~375 tests across the two suites, plus the backend probe
    # this file now runs, so the ceiling has to move with it.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The native `jac` is a self-contained binary that bundles its own Python +
      # jaclang + byllm runtime, so there is nothing to `pip install`. The install
      # script drops it in $HOME/.local/bin; we add that to PATH for later steps.
      - name: Install native jac
        # The install script queries the GitHub API for the latest release; on
        # shared runner IPs the unauthenticated limit (60/hr) causes flaky
        # failures. It honors GITHUB_TOKEN (5000/hr) — pass it, and retry for
        # plain network flakes.
        #
        # PINNED, deliberately. This used to install whatever was newest, which
        # made every PR's CI depend on an upstream release nobody here chose. jac
        # v0.37 removed `[scale.microservices]` from jac.toml and turned it into a
        # hard config error, so `jac install` began exiting 2 before a single test
        # ran — on branches that had touched nothing near it. Tracking latest also
        # means the break lands on whoever pushes next rather than on whoever is
        # ready to handle it. Upgrading is now an explicit commit that moves this
        # number and carries the migration with it. The number is jac.toml's
        # `jac-version` — the same pin install.sh installs and the launcher checks.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAC_VERSION="$(sed -n 's/^jac-version *= *"=*\([0-9][0-9.]*\)".*/\1/p' jac.toml | head -1)"
          [ -n "$JAC_VERSION" ] || { echo "::error::jac.toml has no jac-version pin"; exit 1; }
          for i in 1 2 3; do
            curl -fsSL https://raw.githubusercontent.com/jaseci-labs/jaseci/main/scripts/install.sh \
              | bash -s -- --version "$JAC_VERSION" && break
            echo "install attempt $i failed; retrying in $((i*10))s..."
            sleep $((i*10))
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show jac version
        run: jac --version

      # byLLM is bundled in the native binary, but some Python deps are not (PyYAML
      # for the AG-IR compiler, rich + prompt_toolkit for the chat REPL, and since
      # jac 0.36 litellm itself). Bare `jac install` provisions exactly what jac.toml
      # resolves to — do NOT re-list packages here: an explicit list silently drifts
      # from jac.toml, which is how `sigil chat` once shipped dead with
      # "No module named 'rich'" (#87).
      - name: Provision runtime dependencies (from jac.toml)
        run: jac install

      # Same class of drift, one layer down. jac 0.36 dropped litellm from the runtime
      # closure, leaving it an OPTIONAL dep of byLLM: without a top-level [byllm] section
      # in jac.toml, jac resolves no `llm`
      # capability, `jac install` still exits 0, and byLLM silently swaps in a stub
      # whose every call fails as "'types.SimpleNamespace' object has no attribute
      # 'completion'". The test suite runs on MockLLM and would never notice. Assert
      # the real backend resolved.
      - name: Assert the LLM backend resolved
        run: |
          cat > "$RUNNER_TEMP/llm_probe.jac" <<'PROBE'
          with entry {
              import from jaclang.byllm._optdeps.litellm { HAS_LITELLM }
              print("sigil-llm-ok" if HAS_LITELLM else "sigil-llm-missing");
          }
          PROBE
          out="$(jac run --no-serve "$RUNNER_TEMP/llm_probe.jac")"
          echo "$out"
          case "$out" in
            *sigil-llm-ok*) ;;
            *) echo "::error::byLLM resolved no litellm backend - jac.toml needs its top-level [byllm] section"; exit 1 ;;
          esac

      # Guards the drift above: the test suite never imports the chat REPL, so a
      # missing REPL dependency was invisible until a user ran `sigil chat`. This
      # boots the real CLI entry point and quits at the prompt — it exits non-zero
      # if any of src/sigil_chat.jac's imports are unprovisioned. No API key needed:
      # /exit returns before a model is ever called.
      - name: Smoke-test the chat REPL
        # SIGIL_NO_DAEMON / SIGIL_NO_SERVE: an ordinary CLI command auto-starts the
        # scheduler and the Observatory, and neither belongs in this step. What is
        # being checked is that the REPL's imports are provisioned — not service
        # lifecycle, which src/sigil_{daemon,serve}.test.jac own. Left on, the step
        # spawns a supervisor and a ~25s web-client build that outlive it and keep
        # writing to the same graph while the test suite runs.
        env:
          SIGIL_NO_DAEMON: "1"
          SIGIL_NO_SERVE: "1"
        # --no-serve: under jac >=0.37 a file inside a web-app project SERVES by
        # default; the CLI entry must execute. (`-s` is `--show` there, not a session.)
        run: printf '/exit\n' | jac run --no-serve src/main.jac -- chat

      # The agent lives in the src/ package. `src/*.test.jac` picks up every annex
      # test (present and future) automatically; report_fix_tests.jac and
      # lowering_fix_tests.jac are standalone regression suites (non-annex names),
      # so they are named explicitly.
      - name: Run test suite
        run: jac test src/*.test.jac src/report_fix_tests.jac src/lowering_fix_tests.jac
      # SEPARATE process on purpose: loading these annexes in the same jac test
      # invocation as another src module resets the by-llm slot's __globals__
      # (py3.14 lazy-annotation eval then dies with NameError on the slot's own
      # types — reproduce with: jac test src/compiler/ai/spec_loop.test.jac
      # src/report_fix_tests.jac). Runtime bug, process isolation sidesteps it.
      - name: Run AI-compiler test suite
        run: jac test src/compiler/ai/*.test.jac
      # The MockLLM convergence loops run under `jac run`: multi-module
      # `jac test` resets a by-llm slot's __globals__ and the schema build dies
      # with NameError on the slot's own types (same runtime bug as above).
      - name: Run AI-compiler convergence scenarios
        run: |
          jac run --no-serve src/compiler/ai/scenarios/spec_loop.jac
          jac run --no-serve src/compiler/ai/scenarios/adjudicate.jac
          jac run --no-serve src/compiler/ai/scenarios/workflow_loop.jac
          jac run --no-serve src/compiler/ai/scenarios/lift_e2e.jac
          jac run --no-serve src/compiler/ai/scenarios/lift_direct.jac
          jac run --no-serve src/compiler/ai/scenarios/runtime_budget.jac
          jac run --no-serve src/compiler/ai/scenarios/raise2_canonicalize.jac

  # What a user actually gets: install.sh, then the `sigil` launcher on PATH. The
  # job above drives src/main.jac directly, so it never touches the installer,
  # the launcher, `sigil serve`, `sigil login` or the daemon — every one of which
  # a release ships. It starts where every existing install is: an older jac
  # already on PATH (earlier releases pinned 0.36.1), because `sigil update` is
  # just install.sh again.
  install:
    name: install & serve
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The CLI auto-starts the scheduler; the daemon step below starts it itself.
      SIGIL_NO_DAEMON: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start from the jac earlier releases installed
        run: |
          for i in 1 2 3; do
            curl -fsSL https://raw.githubusercontent.com/jaseci-labs/jaseci/main/scripts/install.sh \
              | bash -s -- --version 0.36.1 && break
            echo "install attempt $i failed; retrying in $((i*10))s..."
            sleep $((i*10))
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/jac" --version

      # The installer clones SIGIL_REF from GitHub, so check it got this commit:
      # its fallback clones the default branch when the ref is missing.
      - name: Install Sigil from this commit
        env:
          SIGIL_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          bash ./install.sh
          want="$(sed -n 's/^jac-version *= *"=*\([0-9][0-9.]*\)".*/\1/p' jac.toml | head -1)"
          have="$(jac --version | awk '{print $2}')"
          [ "$have" = "$want" ] || { echo "::error::install.sh left jac $have on PATH; this tree pins $want"; exit 1; }
          at="$(git -C "$HOME/.sigil/app" rev-parse HEAD)"
          [ "$at" = "${{ github.event.pull_request.head.sha || github.sha }}" ] \
            || { echo "::error::installed $at, not this commit"; exit 1; }

      - name: The launcher refuses a jac other than the pin
        run: |
          printf '#!/bin/sh\necho "jac 0.36.1  (stub)"\n' > "$RUNNER_TEMP/oldjac"
          chmod +x "$RUNNER_TEMP/oldjac"
          if out="$(SIGIL_JAC="$RUNNER_TEMP/oldjac" sigil soul 2>&1)"; then
            echo "::error::sigil ran under jac 0.36.1"; exit 1
          fi
          echo "$out"
          echo "$out" | grep -q "runs on jac"

      # Two separate processes: the write has to survive the first one exiting.
      - name: The CLI keeps its graph between runs
        timeout-minutes: 12
        env:
          SIGIL_NO_SERVE: "1"
        run: |
          sigil configure small_model ci/persist-check
          sigil soul | tee "$RUNNER_TEMP/soul.txt"
          grep -q 'small=ci/persist-check' "$RUNNER_TEMP/soul.txt"

      # The release notes' quickstart: serve, login, then a command routed through
      # the gateway — which must see the graph the CLI wrote above.
      - name: sigil serve, login, and a call through the gateway
        timeout-minutes: 15
        run: |
          sigil serve start
          for i in $(seq 1 150); do
            curl -fsS -o /dev/null http://localhost:8199/ && break
            sleep 4
          done
          curl -fsS -o /dev/null http://localhost:8199/ \
            || { echo "::error::the Observatory never answered on :8199"; exit 1; }
          sigil login
          SIGIL_URL=http://localhost:8199 sigil soul | tee "$RUNNER_TEMP/gateway.txt"
          grep -q 'ci/persist-check' "$RUNNER_TEMP/gateway.txt"

      # The Observatory's endpoints run tools and register commands, without a
      # login. Only this machine's own pages and clients may reach them.
      - name: The Observatory is closed to the network and to other websites
        timeout-minutes: 5
        run: |
          # listening on loopback only, not on the runner's network address
          ss -ltn | grep ':8199 ' | tee "$RUNNER_TEMP/listen.txt"
          if grep -vE '127\.0\.0\.1:8199|\[::1\]:8199' "$RUNNER_TEMP/listen.txt" | grep -q ':8199'; then
            echo "::error::the Observatory listens beyond loopback"; exit 1
          fi
          lan="$(hostname -I | awk '{print $1}')"
          if curl -fsS --max-time 5 -o /dev/null "http://$lan:8199/"; then
            echo "::error::the Observatory answers on $lan"; exit 1
          fi
          # another website's page cannot drive it; refusals answer before any work
          post() {
            curl -sS -o /dev/null -w '%{http_code}' --max-time 120 -X POST \
              http://localhost:8199/walker/api_soul -H 'Content-Type: application/json' -d '{}' "$@"
          }
          check() { got="$(post "${@:2}")"; echo "$1 -> $got"; [ "$got" = "$1" ]; }
          check 403 -H 'Origin: https://evil.example'
          check 403 -H 'Origin: null'
          check 403 -H 'Sec-Fetch-Site: cross-site'
          check 403 -H 'Host: evil.example:8199'          # DNS rebinding
          check 200 -H 'Origin: http://localhost:8199' -H 'Sec-Fetch-Site: same-origin'
          # no CORS grant to other sites
          if curl -sS -D - -o /dev/null -X OPTIONS http://localhost:8199/walker/api_soul \
               -H 'Origin: https://evil.example' -H 'Access-Control-Request-Method: POST' \
             | grep -qi '^access-control-allow-origin'; then
            echo "::error::CORS still grants other origins"; exit 1
          fi
          # no admin portal, so no default-password admin account
          if grep -qE 'Admin portal endpoints registered|created with default' "$HOME/.sigil/log/observatory.log"; then
            echo "::error::jac's admin portal is still enabled"; exit 1
          fi
          # the client bundle (which now carries the embed check) built
          grep -q 'Client bundle built' "$HOME/.sigil/log/observatory.log"

      - name: The daemon starts and stays up
        timeout-minutes: 8
        env:
          SIGIL_NO_SERVE: "1"
        run: |
          sigil daemon start 10
          sleep 45
          sigil daemon status | tee "$RUNNER_TEMP/daemon.txt"
          grep -q 'running' "$RUNNER_TEMP/daemon.txt"

      - name: Service logs
        if: always()
        env:
          SIGIL_NO_SERVE: "1"
        run: |
          for f in "$HOME"/.sigil/log/*; do
            [ -f "$f" ] || continue
            echo "===== $f"; tail -n 80 "$f"
          done
          sigil daemon stop || true
          sigil serve stop || true
