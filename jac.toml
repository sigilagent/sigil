[project]
name = "sigil"
version = "0.6.1"
description = "The skill compiler: SKILL.md compiled through a typed AG-IR into a runnable agent harness, so any model (small and local included) follows the skill by construction."
entry-point = "observatory"
# The jac this tree is built and tested against — the ONE place it is pinned.
# install.sh installs exactly this version, the `sigil` launcher refuses to run
# under any other (SIGIL_JAC_CHECK=0 skips that), and CI installs it too. jac
# ships breaking changes as clean breaks, so another version fails in ways that
# look like Sigil bugs. jac itself only reads this at `jac scale deploy`.
# Bump it WITH the migration that makes the tree work on the new version.
jac-version = "==0.37.25"

# byLLM is CORE to jac: the native `jac` binary bundles it as the built-in `byllm`
# plugin, so there is NO `pip install byllm`. Import it as
# `import from jaclang.byllm.lib { Model }`, and the ambient `by llm()` uses the
# default model configured in [byllm.model] below.

# The AG-IR compiler parses the crystallizer's YAML output via PyYAML. `jac install`
# provisions everything below; the LLM backend itself is NOT here — it rides the
# `llm` capability the [byllm] section switches on. See the note there.
# jac 0.37 made [dependencies] the table for Jac packages (org/name); Python
# packages live in [dependencies.pypi].
[dependencies.pypi]
pyyaml = "latest"
# The interactive `chat` REPL (src/sigil_chat.jac) renders with rich; its line editor
# (src/sigil_input.jac) is prompt_toolkit — multiline input, "/" command palette,
# history suggestions, status toolbar — active only when stdin is a TTY.
rich = "~=15.0"
prompt_toolkit = "~=3.0"
# byLLM's streaming path (chat mode streams the reply token-by-token) imports httpx.
# The `llm` capability below pulls it too; kept declared here so it survives even if
# byLLM's capability ever stops listing it.
httpx = "latest"
# NOTE: do NOT hand-list litellm/loguru/pillow here. They are OPTIONAL deps of byllm
# (jaclang/byllm/_optdeps/*.jac imports each under try/except) and are provisioned by
# the `llm` CAPABILITY instead — see the [byllm] opt-in below. Pinning them here would
# fork from the range jac's capability registry resolves.

# THE LLM OPT-IN — this section is load-bearing, and NOT just for the model name.
# jac 0.36 stopped shipping litellm in the runtime closure (verified by diffing the
# extracted closures: 0.34.5 carries litellm/loguru/PIL/yaml/httpx, 0.36.1 carries none
# of them). Without it byLLM falls back to its `_optdeps` stub, `HAS_LITELLM` is False,
# and every model call dies as `'types.SimpleNamespace' object has no attribute
# 'completion'`. jac provisions the real backend from its `llm` capability — litellm +
# pillow + httpx + loguru — and the capability resolver switches that on by seeing a
# TOP-LEVEL [byllm] table (jaclang/project/capabilities.jac, `byllm_intent_capabilities`).
# No [byllm] section, no LLM.
#
# NOTE the section name, the same trap as [scale.*] below: config only reads `byllm`,
# `scale`, `client`, `mcp` and `desktop` at TOP level. `[plugins.byllm.model]` — where
# this lived until now — is never read into `config.plugins`, so it silently switched
# OFF the llm capability AND silently dropped this default model. Verified on both
# 0.34.5 and 0.36.1: `[byllm.model]` resolves litellm in `jac install --plan` and binds
# default_model; `[plugins.byllm.model]` resolves neither. The reason this only started
# breaking installs at 0.36 is that until then the bundled copy masked it.
#
# The model name itself is only a seed: Sigil keeps its live tiers on the graph (Soul:
# frontier=gpt-5, small=gpt-4o-mini), so this binds any bare `by llm()` only.
# API keys are NOT stored here (jac.toml is git-tracked) — OPENAI_API_KEY /
# ZAI_API_KEY come from the environment / gitignored `.env`, read by litellm.
[byllm.model]
default_model = "gpt-4o-mini"

# No [scale.database] table: jac 0.37 keeps the graph in its embedded Postgres
# and dropped `shelf_db_path` (it warned as an unknown key on every command).
# The Observatory still shows the CLI's agent the way it always has:
# src/sigil_api.jac runs each endpoint's request in a fresh `jac run` of the CLI.

# The Observatory is a tool for this machine, not a public service. Its endpoints
# run tools and register commands, so the server keeps every door it does not
# need shut:
# - no CORS grant to any other site (jac's default is "*"). The Observatory's own
#   page is same-origin with its API and needs none; the page at
#   local.sigilagent.com embeds it rather than calling it. (src/sigil_api.jac
#   also refuses cross-site requests outright — CORS alone only hides the
#   response, it does not stop a request from running.)
# - none of jac's built-in /docs or /graph pages
# - no admin portal: jac otherwise creates an `admin` account with a default
#   password and serves /admin. Sigil does not use it.
# The listening address (loopback only) is set where the server is started:
# src/main.jac, SIGIL_SERVE_HOST to override.
[serve]
cors_origins = []
docs_enabled = false
graph_enabled = false

[scale.admin]
enabled = false

# The client's `sv import from src.sigil` makes jac auto-detect a microservice
# split (gateway + src.sigil subprocess). Sigil is one agent on one graph, so the
# apps must stay colocated in one process or the Observatory and the API stop
# sharing it. jac 0.37 removed `[scale.microservices] enabled = false`; the
# replacement is the gateway's `colocate`, the same instruction to the same
# machinery under the name it has now.
[scale.gateway]
colocate = true

[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
react-hook-form = "^7.71.0"
# the jac client runtime imports @tanstack/react-form; provision it for the web build
"@tanstack/react-form" = "^1.0.0"
zod = "^4.3.6"
"@hookform/resolvers" = "^5.2.2"
vis-network = "^9.1.9"
vis-data = "^7.1.9"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
# The Observatory is styled with Tailwind v4 (same setup as the AG-IR studio):
# src/global.css does `@import "tailwindcss"`, the vite plugin below compiles it.
tailwindcss = "^4.0.0"
"@tailwindcss/vite" = "^4.0.0"

# NOTE: jac ≥0.34 reads [client.vite] (top-level), not [plugins.client.vite].
[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

# No [serve] port: under jac >=0.37 a configured port is an implicit --port on
# EVERY `jac run`, and on a run that executes (--no-serve, the whole CLI) that
# is a hard error. The Observatory's 8199 is passed explicitly instead —
# OBSERVATORY_PORT in src/main.jac, SIGIL_PORT in the `sigil` launcher.

# Served page identity — same brand as the website (docs/index.html).
[client.app_meta_data]
title = "Sigil Observatory"
description = "Watch the sigil agent's graph evolve live — skills, memory, MCP, and 100% token observability"
author = "Jaseci Labs"
theme_color = "#08080d"
icon = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='none' stroke='%23a78bfa' stroke-width='1.6'%3E%3Cpolygon points='16,3 28,10 28,22 16,29 4,22 4,10' /%3E%3Cpath d='M16 3 L16 16 M28 10 L16 16 M28 22 L16 16 M16 29 L16 16 M4 22 L16 16 M4 10 L16 16'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%2322d3ee'/%3E%3C/svg%3E"


