[project]
name = "sigil"
version = "0.3.14"
description = "The skill compiler: SKILL.md compiled through a typed AG-IR into a runnable agent harness, so any model (small and local included) follows the skill by construction."
entry-point = "observatory.jac"

# byLLM is CORE to jac: the native `jac` binary bundles it as the built-in `byllm`
# plugin, so there is NO `pip install byllm`. Import it as
# `import from jaclang.byllm.lib { Model }`, and the ambient `by llm()` uses the
# default model configured in [plugins.byllm.model] below.

# The AG-IR compiler parses the crystallizer's YAML output via PyYAML — the one
# Python dependency the native binary does NOT bundle. `jac install` provisions it
# into the project venv.
[dependencies]
pyyaml = "latest"
# The interactive `chat` REPL (sigil_chat.jac) renders with rich; its line editor
# (sigil_input.jac) is prompt_toolkit — multiline input, "/" command palette,
# history suggestions, status toolbar — active only when stdin is a TTY.
rich = "~=15.0"
prompt_toolkit = "~=3.0"
# byLLM's streaming path (chat mode streams the reply token-by-token) imports httpx.
# The native runtime does bundle it; kept here so a non-bundled runtime still works.
httpx = "latest"
# NOTE: do not add litellm/loguru/pillow here. The native jac runtime ships them in
# its own closure, and litellm has no wheel for that bundled Python — declaring it
# makes `jac install` (and therefore install.sh) fail outright.

# Default builtin `llm` model (any by-llm() call that doesn't override). Sigil
# keeps its live model tiers on the graph (Soul), so this is only a seed default.
# Builtin `llm` default. Sigil keeps its live tiers on the graph (Soul:
# frontier=gpt-5, small=gpt-4o-mini), so this only seeds any bare `by llm()`.
# API keys are NOT stored here (jac.toml is git-tracked) — OPENAI_API_KEY /
# ZAI_API_KEY come from the environment / gitignored `.env`, read by litellm.
[plugins.byllm.model]
default_model = "gpt-4o-mini"

# One graph, two doors: `jac run main.jac` (CLI) persists to .jac/data/sigil.db
# (the project-name default), and this points `jac start observatory.jac` at the
# SAME file — so skills taught in the CLI show up live in the Observatory.
# Overridden by MONGODB_URI if set (both sides then need it).
[plugins.scale.database]
shelf_db_path = ".jac/data/sigil.db"

# The client's `sv import from src.sigil` makes `jac start` auto-detect a
# microservice split (gateway + src.sigil subprocess). Sigil is one agent on one
# graph — force the single-process server so the Observatory and API share it.
[plugins.scale.microservices]
enabled = false

[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
react-hook-form = "^7.71.0"
# the jac client runtime imports @tanstack/react-form; provision it for the web build
"@tanstack/react-form" = "^1.0.0"
zod = "^4.3.6"
"@hookform/resolvers" = "^5.2.2"
vis-network = "^9.1.9"
vis-data = "^7.1.9"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
# The Observatory is styled with Tailwind v4 (same setup as the AG-IR studio):
# global.css does `@import "tailwindcss"`, the vite plugin below compiles it.
tailwindcss = "^4.0.0"
"@tailwindcss/vite" = "^4.0.0"

# NOTE: jac ≥0.34 reads [client.vite] (top-level), not [plugins.client.vite].
[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

# The Observatory's dedicated port — same 8199 the `sigil` launcher's
# SIGIL_PORT defaults to. `sigil serve` claims it strictly (_claim_port);
# a bare `jac start observatory.jac` also lands here, but only `sigil serve`
# guards against jac's silent port-in-use fallback.
[serve]
port = 8199

# Served page identity — same brand as the website (docs/index.html).
[client.app_meta_data]
title = "Sigil Observatory"
description = "Watch the sigil agent's graph evolve live — skills, memory, MCP, and 100% token observability"
author = "Jaseci Labs"
theme_color = "#08080d"
icon = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='none' stroke='%23a78bfa' stroke-width='1.6'%3E%3Cpolygon points='16,3 28,10 28,22 16,29 4,22 4,10' /%3E%3Cpath d='M16 3 L16 16 M28 10 L16 16 M28 22 L16 16 M16 29 L16 16 M4 22 L16 16 M4 10 L16 16'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%2322d3ee'/%3E%3C/svg%3E"


